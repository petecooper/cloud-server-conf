    log_format ip-90
        '$time_iso8601 '
        '$msec '
        'ip="$remote_addr" '
        'rqmth="$request_method" '
        'rq="$request" '
        'rquri="$request_uri" '
        'q="$query_string" '
        'uri="$uri" '
        'url="$scheme://$host$request_uri" '
        'sts="$status" '
        'rqlen="$request_length" '
        'rqtm="$request_time" '
        'con="$connection" '
        'conrq="$connection_requests" '
        'contm="$connection_time" '
        'bdybs="$body_bytes_sent" '
        'gzpr="$gzip_ratio" '
        'upsts="$upstream_status" '
        'upctm="$upstream_connect_time" '
        'uprtm="$upstream_response_time" '
        'uprln="$upstream_response_length" '
        'uphtm="$upstream_header_time" '
        'upbyr="$upstream_bytes_received" '
        'upbys="$upstream_bytes_sent" '
        'upcac="$upstream_cache_status" '
        'srvad="$server_addr" '
		'srvpt="$server_port" '
        'srvpr="$server_protocol" '
        'h2="$http2" '
        'h3="$http3" '
        'tlspr="$ssl_protocol" '
        'tlscp="$ssl_cipher" '
        'tlscs="$ssl_ciphers" '
        'tlscr="$ssl_curves" '
        'tlsed="$ssl_early_data" '
        'tlssr="$ssl_session_reused" '
        'htref="$http_referer" '
        'htua="$http_user_agent" '
        'htxff="$http_x_forwarded_for" '
        'htcip="$http_cf_connecting_ip" '
    ;
